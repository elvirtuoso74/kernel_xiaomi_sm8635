name: Build Android Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk \
          gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils \
          flex bison gperf build-essential zip curl libc6-dev libncurses-dev \
          libx11-dev libreadline-dev libgl1-mesa-dev python3-markdown \
          libxml2-utils xsltproc make bc grep cpio kmod openssl libelf-dev \
          pahole libssl-dev libarchive-tools zstd rsync wget

        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb || true

    - name: Download ZyCromerZ Clang
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains

        wget https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz
        tar -xvf Clang-23.0.0git-20260130.tar.gz
        mv Clang-* clang

        echo "CLANG_PATH=$HOME/toolchains/clang/bin" >> $GITHUB_ENV

    - name: Create build script
      run: |
        cat << 'EOF' > build.sh
        #!/bin/bash

        echo -e "\n[INFO]: BUILD STARTED..!\n"

        git submodule init && git submodule update

        export KERNEL_ROOT="$(pwd)"
        export ARCH=arm64
        export KBUILD_BUILD_USER="@ravindu644"

        mkdir -p "${KERNEL_ROOT}/out" "${KERNEL_ROOT}/build"

        # Toolchain
        export PATH="${CLANG_PATH}:${PATH}"
        export CLANG_PATH="${CLANG_PATH}"

        export BUILD_CC="${CLANG_PATH}/clang"

        export BUILD_OPTIONS=(
            -C "${KERNEL_ROOT}"
            O="${KERNEL_ROOT}/out"
            -j"$(nproc)"
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            CC="${BUILD_CC}"
            LLVM=1
            LLVM_IAS=1
            AR="${CLANG_PATH}/llvm-ar"
            NM="${CLANG_PATH}/llvm-nm"
            LD="${CLANG_PATH}/ld.lld"
            STRIP="${CLANG_PATH}/llvm-strip"
            OBJCOPY="${CLANG_PATH}/llvm-objcopy"
            OBJDUMP="${CLANG_PATH}/llvm-objdump"
            READELF="${CLANG_PATH}/llvm-readelf"
            HOSTCC="${CLANG_PATH}/clang"
            HOSTCXX="${CLANG_PATH}/clang++"
        )

        build_kernel(){
            make "${BUILD_OPTIONS[@]}" gki_defconfig
            make "${BUILD_OPTIONS[@]}" Image || exit 1

            cp "${KERNEL_ROOT}/out/arch/arm64/boot/Image" "${KERNEL_ROOT}/build"

            echo -e "\n[INFO]: BUILD FINISHED..!"
        }

        build_kernel
        EOF

        chmod +x build.sh

    - name: Build Kernel
      run: ./build.sh

    - name: Prepare Release Tag
      id: tag
      run: |
        echo "tag=kernel-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Android Kernel Build ${{ steps.tag.outputs.tag }}
        files: |
          build/Image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
