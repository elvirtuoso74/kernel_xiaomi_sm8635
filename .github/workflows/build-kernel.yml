name: Build Android GKI Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    # ---------------- CHECKOUT ----------------
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # ---------------- DEPENDENCIES ----------------
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache curl flex g++ gcc git \
          libelf-dev libncurses-dev libssl-dev lz4 pahole \
          python3 python-is-python3 rsync unzip zip zstd \
          device-tree-compiler xz-utils wget libxml2-utils xsltproc

        # required by some prebuilts
        wget -q http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb || true

    # ---------------- CLANG ----------------
    - name: Download ZyCromerZ Clang 23
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang

        wget -q https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz
        tar -xf Clang-23.0.0git-20260130.tar.gz

        # cari binary clang yang bener
        CLANG_BIN=$(find $HOME/clang -type f -name clang | head -n 1)
        CLANG_DIR=$(dirname "$CLANG_BIN")

        echo "Using clang at: $CLANG_DIR"
        echo "CLANG_PATH=$CLANG_DIR" >> $GITHUB_ENV

    # ---------------- BUILD SCRIPT ----------------
    - name: Create build script
      run: |
        cat << 'EOF' > build.sh
        #!/usr/bin/env bash
        set -e

        echo "===== ANDROID GKI KERNEL BUILD ====="

        export KERNEL_ROOT=$(pwd)
        export OUT_DIR=$KERNEL_ROOT/out
        mkdir -p $OUT_DIR build

        echo "Kernel root: $KERNEL_ROOT"
        echo "Out dir: $OUT_DIR"
        echo "Clang path: $CLANG_PATH"

        # setup clang
        export PATH="$CLANG_PATH:$PATH"
        clang --version

        # GKI LLVM build environment
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        # ---------------- CONFIG ----------------
        make O=$OUT_DIR ARCH=arm64 gki_defconfig

        # ---------------- BUILD ----------------
        make -j$(nproc) O=$OUT_DIR \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

        # ---------------- OUTPUT ----------------
        cp $OUT_DIR/arch/arm64/boot/Image build/Image

        echo "===== BUILD SUCCESS ====="
        EOF

        chmod +x build.sh

    # ---------------- BUILD ----------------
    - name: Build Kernel
      run: ./build.sh

    # ---------------- RELEASE ----------------
    - name: Generate Tag
      id: tag
      run: echo "tag=gki-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: GKI Kernel Build ${{ steps.tag.outputs.tag }}
        files: build/Image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
