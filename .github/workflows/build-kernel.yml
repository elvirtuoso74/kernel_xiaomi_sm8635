name: Build Kernel

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
- name: Checkout source
  uses: actions/checkout@v4
  with:
    fetch-depth: 0

# Dependencies
- name: Install packages
  run: |
    sudo apt update
    sudo apt install -y \
      git bc bison flex libssl-dev make \
      libc6-dev libncurses5-dev libelf-dev \
      dwarves curl xz-utils python3

# Download Clang 23
- name: Setup Clang 23
  run: |
    mkdir -p $HOME/toolchain
    cd $HOME/toolchain
    wget https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz
    tar -xvf Clang-23.0.0git-20260130.tar.gz
    echo "CLANG INSTALLED:"
    ls $HOME/toolchain

# Create build script
- name: Generate build.sh
  run: |
    cat << 'EOF' > build.sh
    #!/usr/bin/env bash
    set -e

    KERNEL_DIR=$(pwd)
    OUT_DIR=$KERNEL_DIR/out
    CLANG_DIR=$HOME/toolchain/Clang-23.0.0git-20260130

    export PATH=$CLANG_DIR/bin:$PATH

    # LLVM FULL MODE
    export LLVM=1
    export LLVM_IAS=1

    export CC=clang
    export CXX=clang++
    export LD=ld.lld
    export AR=llvm-ar
    export NM=llvm-nm
    export OBJCOPY=llvm-objcopy
    export OBJDUMP=llvm-objdump
    export STRIP=llvm-strip
    export READELF=llvm-readelf

    export ARCH=arm64
    export SUBARCH=arm64

    export ANDROID_MAJOR_VERSION=s
    export PLATFORM_VERSION=13

    echo "Using clang:"
    clang --version
    ld.lld --version

    # Clean old build
    rm -rf $OUT_DIR
    mkdir -p $OUT_DIR

    # Defconfig
    make O=$OUT_DIR GKI_defconfig

    # Build
    make -j$(nproc --all) O=$OUT_DIR \
        CC=clang \
        LD=ld.lld \
        AR=llvm-ar \
        NM=llvm-nm \
        OBJCOPY=llvm-objcopy \
        OBJDUMP=llvm-objdump \
        STRIP=llvm-strip
    EOF

    chmod +x build.sh

# Compile
- name: Compile Kernel
  run: ./build.sh

# Collect outputs
- name: Prepare artifacts
  run: |
    mkdir release
    find out -name "Image*" -exec cp {} release/ \; || true
    find out -name "*.dtb" -exec cp {} release/ \; || true
    find out -name "*.dtbo" -exec cp {} release/ \; || true

# Upload
- name: Upload Release
  uses: softprops/action-gh-release@v2
  with:
    tag_name: build-${{ github.run_number }}
    name: Kernel Build ${{ github.run_number }}
    files: release/*
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
